<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    
    </head>
    <body>
        <h2>javascript objects</h2>
        <h4>objects and methods</h4>
        <p>a method as a function definition stored as value</p>
        <p id="demore"></p>

        
        
    <script>
        const person = {
            firstname : "peter",
            lastname : "kamalu",
            age : 70,
            fullName :function() {
                return this.firstname + " " + this.lastname;
            }
        };
        

        document.getElementById("demore").innerHTML = person.fullName();

    </script>
    </body>
</html>
